<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" /> <!-- blue-600 -->
      <stop offset="100%" stop-color="#4f46e5" /> <!-- indigo-600 -->
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  
  <!-- Dumbbell tilted 45 degrees -->
  <g transform="rotate(-45 50 50)">
    <!-- Handle -->
    <rect x="35" y="44" width="30" height="12" fill="url(#metal)" rx="2"/>
    <!-- Left Inner Weight -->
    <rect x="25" y="30" width="10" height="40" fill="url(#metal)" rx="3"/>
    <!-- Right Inner Weight -->
    <rect x="65" y="30" width="10" height="40" fill="url(#metal)" rx="3"/>
    <!-- Left Outer Weight -->
    <rect x="15" y="20" width="10" height="60" fill="url(#metal)" rx="4"/>
    <!-- Right Outer Weight -->
    <rect x="75" y="20" width="10" height="60" fill="url(#metal)" rx="4"/>
  </g>
</svg>